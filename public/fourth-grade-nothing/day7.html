<div class="hero"><div class="book">📘</div><div class="eyebrow">10-DAY ENGLISH READING CAMP</div><div class="title">Tales of a Fourth Grade Nothing</div><div class="author">Judy Blume · Peter & Fudge 的家庭故事</div></div>

<script>
const DATA=[
{title:'The Big Winner',pages:'pp. 1–4',focus:'Peter 赢得了小乌龟 Dribble，弟弟 Fudge 也第一次登场。',tip:'Peter 说 Fudge 是他最大的麻烦。你觉得为什么？',words:[['turtle','乌龟'],['winner','获胜者'],['tiny','很小的'],['pet','宠物'],['problem','问题']],prompt:'Peter says Fudge is his biggest problem. Do you agree? Why?',tags:['3–5 sentences','because','I think…'],starters:['I agree/disagree with Peter because…','One example is…'],teacher:'Peter 的语气很有趣：他一边抱怨 Fudge，一边又忍不住观察他。明天看看 Fudge 怎样抢走全家的注意力。',qs:[['What did Peter win at Jimmy Fargo’s party?','A goldfish','A turtle','A puppy','A train','B'],['How old is Peter?','Seven','Eight','Nine','Ten','C'],['What is the turtle’s name?','Fang','Dribble','Fudge','Henry','B'],['Who is Fudge?','Peter’s friend','Peter’s teacher','Peter’s brother','Peter’s cousin','C'],['Where does Peter live?','A farm','An apartment building','A school','A hotel','B']]},
{title:'Mr. and Mrs. Juicy-O',pages:'pp. 5–18',focus:'Yarbys 来家里做客，Fudge 一直成为全场焦点。',tip:'Peter 为什么越来越不喜欢这次晚餐？找到两个细节。',words:[['guest','客人'],['surprise','惊喜'],['attention','注意力'],['jealous','嫉妒的'],['behave','表现得体']],prompt:'How does Peter feel when the Yarbys pay attention to Fudge? Use two details from the chapter.',tags:['3–5 sentences','first / then','feel'],starters:['At first Peter feels…','This is shown when…'],teacher:'Peter 的嫉妒并不意味着他是坏孩子；他只是也希望大人能看见自己。',qs:[['Why do the Yarbys visit?','For a school project','For Juicy-O business','To buy a turtle','For a birthday','B'],['What does Mrs. Yarby bring?','A present','A dog','A book','A bicycle','A'],['Who gets most of the attention?','Peter','Henry','Fudge','Jimmy','C'],['Peter is mostly…','excited','jealous','sleepy','proud','B'],['The chapter mainly shows…','a quiet dinner','family attention can feel unfair','a school race','a new pet','B']]},
{title:'The Family Dog',pages:'pp. 19–26',focus:'Peter 想要一只狗，家庭里的责任和公平问题出现了。',tip:'Peter 想要狗的理由充分吗？你会把狗交给谁照顾？',words:[['responsibility','责任'],['promise','承诺'],['decide','决定'],['fair','公平的'],['owner','主人']],prompt:'Peter wants a dog. Is his family’s decision fair? Explain your opinion.',tags:['3–5 sentences','I believe…','fair / unfair'],starters:['I think the decision is…','The best reason is…'],teacher:'想要宠物很容易，照顾宠物才是真正的责任。',qs:[['What pet does Peter want?','A bird','A dog','A cat','A hamster','B'],['What is Peter asked to think about?','Responsibility','A test','A trip','A costume','A'],['A promise means…','a question','an agreement','a joke','a gift','B'],['Peter’s main wish is to…','move away','have a dog','win a game','meet a star','B'],['This chapter is about…','pet ownership and responsibility','school rules','television','rain','A']]},
{title:'My Brother the Bird',pages:'pp. 27–39',focus:'Fudge 学会说话，Peter 既惊讶又有些嫉妒。',tip:'Peter 是怎样的哥哥？用两个行为来证明。',words:[['brother','兄弟'],['imitate','模仿'],['proud','骄傲的'],['annoyed','恼火的'],['jealous','嫉妒的']],prompt:'What kind of brother is Peter? Use two examples from the chapter.',tags:['3–5 sentences','He is…','for example'],starters:['Peter is a … brother because…','For example, he…'],teacher:'一个人可以同时感到骄傲、烦恼和嫉妒，这些情绪可以同时存在。',qs:[['What new skill does Fudge show?','Reading','Talking','Swimming','Drawing','B'],['Peter feels mixed because Fudge…','gets attention','loses a toy','goes to school','has a dog','A'],['Peter is in…','fourth grade','second grade','sixth grade','kindergarten','A'],['To imitate means to…','copy','forget','hide','repair','A'],['Peter’s feelings are…','only happy','mixed','only angry','unknown','B']]},
{title:'The Birthday Bash',pages:'pp. 40–53',focus:'Fudge 的三岁生日派对混乱又好笑，Peter 被迫帮忙。',tip:'派对中哪个场面最混乱？为什么？',words:[['birthday','生日'],['party','派对'],['candle','蜡烛'],['mess','混乱'],['embarrassed','尴尬的']],prompt:'Choose one moment from the party and describe it in Peter’s voice.',tags:['3–5 sentences','suddenly','but'],starters:['At first everything was…','Then suddenly…'],teacher:'这一章很适合练习“用细节写场景”：声音、动作和人物反应会让画面更生动。',qs:[['How old is Fudge?','Two','Three','Four','Nine','B'],['What happens to the party?','It is very quiet','It becomes chaotic','It is cancelled','It moves outside','B'],['Who helps with the party?','Peter','Only Fudge','Mr. Yarby','Henry','A'],['A bash is a…','party','problem','book','pet','A'],['Peter mostly feels…','bored and tired','proud and calm','lost and excited','sleepy and happy','A']]},
{title:'Fang Hits Town',pages:'pp. 54–68',focus:'Fudge 的新牙引发家庭反应，Peter 观察着大家的变化。',tip:'这一章里谁最需要帮助？为什么？',words:[['dentist','牙医'],['tooth','牙齿'],['hurt','疼痛'],['worry','担心'],['calm','冷静的']],prompt:'Who needs help most in this chapter? Explain why.',tags:['3–5 sentences','needs help','because'],starters:['I think … needs help because…','He/She might feel…'],teacher:'Peter 常常用开玩笑来面对担心。读一读他的玩笑背后藏着什么情绪。',qs:[['“Fang” is connected to…','a tooth','a train','a turtle','a TV show','A'],['Who is worried?','The family','Nobody','Only Henry','A teacher','A'],['A dentist helps with…','teeth','books','cars','parties','A'],['To calm someone means to…','make them less upset','make them run','make them laugh loudly','make them hungry','A'],['Peter often uses humor to…','hide feelings','win money','teach math','train dogs','A']]},
{title:'The Flying Train Committee',pages:'pp. 69–81',focus:'Peter 的学校项目遇上家庭干扰，他要在小组中完成任务。',tip:'Peter 在小组项目中做得好吗？用事实支持你的观点。',words:[['committee','委员会'],['project','项目'],['model','模型'],['cooperate','合作'],['interrupt','打断']],prompt:'Did Peter do a good job in the group project? Give reasons.',tags:['3–5 sentences','I think','although'],starters:['Peter did/did not do well because…','Although…, he…'],teacher:'今天的关键词是 cooperate：合作不是每个人做一样的事，而是一起把事情完成。',qs:[['What are the students making?','A model/project','A cake','A pet house','A TV show','A'],['A committee is…','a group working together','a pet','a meal','a room','A'],['Peter has trouble because…','home life interrupts','he hates school','he is sick','he loses a book','A'],['To cooperate means to…','work together','run away','argue only','sleep','A'],['The chapter connects…','school and home','space and oceans','sports and music','dogs and cats','A']]},
{title:'The TV Star',pages:'pp. 82–96',focus:'Fudge 成为电视节目的焦点，Peter 的存在感又被挤到一边。',tip:'为什么大人们都被 Fudge 吸引？Peter 感觉如何？',words:[['television','电视'],['star','明星'],['perform','表演'],['famous','出名的'],['ignored','被忽视的']],prompt:'Why does Fudge attract so much attention? How does Peter feel?',tags:['3–5 sentences','because','however'],starters:['People notice Fudge because…','Peter, however, feels…'],teacher:'“被看见”是 Peter 一直在意的事。想想他有没有也在看见别人。',qs:[['What happens to Fudge?','He appears on TV','He goes to college','He buys a dog','He moves away','A'],['A TV star is someone who…','appears on television','owns a turtle','teaches school','writes homework','A'],['Peter feels…','ignored','famous','relaxed','confused about math','A'],['To perform means to…','act or do something for others','sleep','hide','eat','A'],['This chapter increases…','Fudge’s fame','Peter’s height','the turtle’s size','the rain','A']]},
{title:'Just Another Rainy Day',pages:'pp. 97–107',focus:'一个看似普通的雨天，家庭中的矛盾和意外不断发生。',tip:'这一章最“不普通”的地方是什么？',words:[['ordinary','普通的'],['rainy','下雨的'],['suddenly','突然地'],['imagine','想象'],['adventure','冒险']],prompt:'What makes this rainy day different from an ordinary day?',tags:['3–5 sentences','usually','but today'],starters:['Usually, a rainy day is…','But today…'],teacher:'作者用“普通的一天”做标题，却让很多小事连在一起。注意故事怎样制造节奏。',qs:[['The day begins with…','rain','snow','a party','a race','A'],['Ordinary means…','usual','famous','dangerous','tiny','A'],['The chapter is different because…','many events happen','nobody speaks','Peter is at school','the dog wins','A'],['Peter often describes events with…','humor','scientific charts','poems only','silence','A'],['A good summary should include…','important events','every single word','only the title','a new ending','A']]},
{title:'Dribble!',pages:'pp. 108–结尾',focus:'Dribble 的命运带来全书高潮，Peter 必须面对最难过的一刻。',tip:'写完最后一章后，你最想对 Peter 说什么？',words:[['accident','意外'],['disappear','消失'],['heartbroken','心碎的'],['comfort','安慰'],['advice','建议']],prompt:'Write a letter to Peter. Comfort him and give him one piece of advice.',tags:['5–7 sentences','Dear Peter,','I hope…'],starters:['Dear Peter, I am sorry that…','My advice is…','You are not alone because…'],teacher:'恭喜你读完这本书！Peter 的故事告诉我们：家人会让人烦恼，也会在最需要的时候彼此陪伴。',qs:[['Who is Dribble?','Peter’s turtle','Peter’s teacher','Fudge’s friend','A TV star','A'],['The last chapter is mainly about…','a difficult family event','a school test','a new vacation','a birthday cake','A'],['To comfort someone means to…','help them feel better','make them angry','ignore them','surprise them','A'],['Peter needs…','support','a new grade','a train committee','a TV job','A'],['A strong ending can make readers…','think and feel','forget every character','skip the story','learn nothing','A']]}
];
DATA.length=10;
const pathDay=Number((location.pathname.match(/day(\\d+)/)||[])[1]||0);
let day=Math.min(10,Math.max(1,pathDay||Number(new URLSearchParams(location.search).get('day')||1)));let photo=null;
const $=id=>document.getElementById(id);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderNav(){ $('days').innerHTML=pathDay ? `<button class="active">Day ${day}</button>` : DATA.map((_,i)=>`<button class="${i+1===day?'active':''}" onclick="go(${i+1})">Day ${i+1}</button>`).join('') }
function render(){const d=DATA[day-1];document.title=`Day ${day} · ${d.title} · Tales of a Fourth Grade Nothing`;renderNav();$('app').innerHTML=`
<section class="card"><div class="head read">📖 <div>今日阅读<small>Chapter ${day} · ${d.pages}</small></div></div><div class="body"><div class="chap"><input type="checkbox" id="done"> <div><b>Chapter ${day} — ${d.title}</b><br><span>${d.focus}</span></div></div><div class="tip">💡 ${d.tip}</div></div></section>
<section class="card"><div class="head quiz">🧠 <div>阅读理解<small>5 题 · 读完再挑战</small></div></div><div class="body">${d.qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b><div class="opts">${q.slice(1,5).map((o,j)=>`<button data-correct="${q[5]}" data-key="${'ABCD'[j]}" onclick="answer(this)">${'ABCD'[j]}. ${o}</button>`).join('')}</div></div>`).join('')}</div></section>
<section class="card"><div class="head vocab">🔤 <div>单词闪卡<small>点击翻面 · 先猜再看</small></div></div><div class="body"><div class="wordgrid">${d.words.map(w=>`<div class="word" onclick="this.classList.toggle('flip')"><div class="wi"><div class="front">${w[0]}</div><div class="back">${w[1]}</div></div></div>`).join('')}</div></div></section>
<section class="card"><div class="head write">✏️ <div>今日写作<small>写完拍照提交 · Day ${day}</small></div></div><div class="body"><div class="prompt"><b>Writing prompt</b><br>${d.prompt}</div><div class="tags">${d.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>${d.starters.map(x=>`<div class="starter">${x}</div>`).join('')}<div class="upload" id="upload">📷 点击拍照或选择作业照片<input type="file" accept="image/*" capture="environment" onchange="pick(this)"><img class="preview" id="preview"></div><button class="submit" onclick="submitWork()">提交给老师</button><div class="success" id="success">✅ 已提交！老师会认真阅读你的回答。</div></div></section>
<section class="card"><div class="head teacher">💬 <div>老师的话<small>给今天的你</small></div></div><div class="body"><div class="teacherbox">${d.teacher}</div></div></section>`;if(localStorage.name)$('name').value=localStorage.name}
function go(n){day=n;history.replaceState({},'',`?day=${n}`);render();scrollTo(0,0)}function answer(b){if(b.parentNode.dataset.done)return;b.parentNode.dataset.done='1';[...b.parentNode.children].forEach(x=>x.disabled=true);b.classList.add(b.dataset.key===b.dataset.correct?'correct':'wrong');if(b.dataset.key!==b.dataset.correct)[...b.parentNode.children].find(x=>x.dataset.key===b.dataset.correct).classList.add('correct')}function pick(i){photo=i.files[0];if(!photo)return;const r=new FileReader();r.onload=e=>{$('preview').src=e.target.result;$('preview').style.display='block';$('upload').firstChild.textContent='已选择作业照片';};r.readAsDataURL(photo)}async function submitWork(){const name=$('name').value.trim();if(!name){alert('请先输入你的名字');return}if(!photo){alert('请先选择或拍摄作业照片');return}localStorage.name=name;const f=new FormData();f.append('studentName',name);f.append('day',`N${day}`);f.append('photo',photo);const r=await fetch('/api/submit',{method:'POST',body:f});if(r.ok)$('success').style.display='block';else alert('提交失败，请稍后再试')}$('name').addEventListener('input',e=>localStorage.name=e.target.value);render();
</script>
<script>
const TEACHER_NOTES=[
  'Welcome to Day 1! Peter has just won Dribble, but his little brother Fudge may be the biggest surprise of all. As you read, notice how Peter can be funny and frustrated at the same time. What would you say to him?',
  'Today Peter has to share the spotlight with Fudge. Look for the moments when Peter feels left out. Can you understand his feelings, even when his thoughts sound a little sharp?',
  'Peter wants something badly, but wanting a pet also means taking responsibility. Use details from the chapter to decide whether the adults made a fair choice.',
  'Peter is not simply a “good” or “bad” brother. He can be jealous, caring, and annoyed in the same scene. Great readers notice all of those layers.',
  'What a birthday bash! Pay attention to sounds, actions, and reactions. Those small details help us picture the scene and make our writing more alive.',
  'Peter often uses humor when a family moment feels uncomfortable. Today, ask yourself what might be hiding underneath his jokes.',
  'School and home keep colliding for Peter. Think about what makes a group project work—and what can make cooperation difficult.',
  'Fudge gets the attention, but Peter is watching everything carefully. Whose feelings do you notice first, and whose feelings are easy to miss?',
  'A rainy day can still be full of movement and surprises. Notice how the author turns ordinary moments into an adventure.',
  'You finished the book! Peter’s story is funny, frustrating, and tender all at once. Write to him with kindness, and remember the details that made you care.'
];
function decorateFrindleStyle(){
  const first=document.querySelector('.card');
  if(first && !document.querySelector('.audio-card')){
    const audio=document.createElement('section'); audio.className='card audio-card';
    audio.innerHTML='<div class="head" style="background:#1a1a2e">🎧 <div>朗读音频<small>American English · Chapter '+day+'</small></div></div><div class="body" style="background:#0d0d1f"><audio controls preload="metadata" style="width:100%" src="/fourth-grade-nothing/audio/day'+day+'.mp3"></audio><div class="tip">Listen once while following the book, then read the chapter aloud yourself.</div></div>';
    first.after(audio);
  }
  const teacher=document.querySelector('.teacherbox');
  if(teacher) teacher.innerHTML=TEACHER_NOTES[day-1];
  const tagBox=document.querySelector('.tags');
  if(tagBox && !document.querySelector('.writing-bank')){
    const bank=document.createElement('div'); bank.className='writing-bank';
    bank.innerHTML='<b>📚 Word Bank · Writing Clues</b><div class="tags">'+DATA[day-1].words.map(w=>`<span class="tag">${w[0]} <small>${w[1]}</small></span>`).join('')+'</div>';
    tagBox.parentNode.insertBefore(bank,tagBox.nextSibling);
  }
  const h=document.querySelector('.teacher .head'); if(h) h.firstElementChild.innerHTML='Teacher’s Note<small>Today’s message</small>';
}
new MutationObserver(decorateFrindleStyle).observe($('app'),{childList:true});
decorateFrindleStyle();
</script></body></html>
